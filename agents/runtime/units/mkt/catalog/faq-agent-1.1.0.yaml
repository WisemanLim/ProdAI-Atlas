# 번들 템플릿 (1st-party, 플랫폼 키로 서명·출처 생성) — atlas-template.yaml (FR-X-MKT-01)
kind: agent
name: faq-agent
version: 1.1.0
title: FAQ 상담 에이전트
description: 사내 FAQ·정책 문서를 근거로 답하는 상담 에이전트 (AL-RUN 하네스)
unit_ids: [AL-RUN, X-KB]
layer: L1
requires: [X-KB, GR-IO]
changelog: 답변에 출처 링크 포함 · 말투 옵션 casual 추가
params:
  type: object
  required: [agent_name, kb]
  properties:
    agent_name: {type: string, title: 에이전트 이름, pattern: "^[a-z][a-z0-9-]{2,40}$"}
    kb: {type: string, title: 지식베이스, default: policies}
    tone: {type: string, title: 말투, enum: [formal, friendly, casual], default: formal}
    api_key: {type: string, title: 외부 API 키, format: password, x-atlas-secret: true}
eval:                                   # 업그레이드 전 회귀 스위트 (FR-X-MKT-05, mkt.upgrade.require_eval_pass)
  suite:
    name: faq-agent-upgrade
    dataset: {name: planner-golden}
    targets: [{id: faq-agent-1.1.0, type: prompt, model: chat-default, template: "{{input.goal}}"}]
    scorers: [{type: regex, pattern: "."}]
    epochs: 1
    thresholds: {pass_rate: 1.0}
sbom:
  bomFormat: CycloneDX
  specVersion: "1.6"
  components:
    - {type: library, name: fastapi, version: "0.115.0", purl: "pkg:pypi/fastapi@0.115.0"}
    - {type: library, name: httpx, version: "0.27.0", purl: "pkg:pypi/httpx@0.27.0"}
payload:
  deploy: {endpoint: "http://agent-al-run:8000", env: dev, driver: compose}
  manifest:
    apiVersion: agents.prodai.io/v1alpha1
    kind: AtlasAgent
    metadata: {name: "{{params.agent_name}}", unitId: AL-RUN, layer: L1, concept: 01-agentic-loops}
    spec:
      version: 1.1.0
      interfaces: [{binding: JSONRPC, port: 8000, path: /a2a}]
      agentCard: {path: /.well-known/agent-card.json, visibility: tenant, skills: [loop.run]}
      harness: {modelAlias: chat-default, tools: [], guardrailPolicyRef: null, systemPrompt: "지식베이스 {{params.kb}} 를 근거로 {{params.tone}} 말투로 답하고 출처를 붙인다."}
      config: {kb: "{{params.kb}}"}
      state: {stateless: false, store: sql, stateSchemaVersion: 1}
      health: {liveness: /healthz, readiness: /readyz, startupTimeoutSec: 60}
      drivers: {supported: [local, compose]}
