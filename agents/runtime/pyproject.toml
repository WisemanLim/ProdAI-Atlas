[project]
name = "prodai-agents"
version = "0.2.0"
description = "ProdAI Atlas — Atlas Agent Spec 런타임(prodai-agent-core) + 단위 에이전트(AL·MCP·GR·OB·EV) + MCP 서버"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "jsonschema>=4.23",
  "pyyaml>=6",
  "fastmcp>=4.0",
  "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

# 모든 테스트는 test/ 로 통일 (시험표준 dev-env/impl 도 test/ 하위)
[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[project.scripts]
atlas-agent = "app.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_agent_core", "units", "mcp_servers", "app"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "atlas_migrations"   # alembic 스크립트 — 설치본에서는 app.main 이 이 경로를 쓴다

[tool.uv]
package = true
