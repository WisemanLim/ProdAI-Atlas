<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ProdAI Atlas</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; font: 14px system-ui, sans-serif; background: #0f1115; color: #c9d1d9; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3fb950; margin-right: 8px; animation: p 1s infinite alternate; }
  @keyframes p { from { opacity: .3 } to { opacity: 1 } }
</style>
</head>
<body><div><span class="dot"></span>Atlas Manager 시작 중…</div></body>
</html>
