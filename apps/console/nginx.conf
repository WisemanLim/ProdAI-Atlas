# prodai-atlas console — runtime 정적 서빙 + 같은 출처 프록시 (Manager embed.FS 내장 전까지)
server {
  listen 5173;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://manager:8080/api/; }
  location = /health/manager { proxy_pass http://manager:8080/health; }
  location /gw/ { proxy_pass http://gateway:8080/; }
  location /svc/ { proxy_pass http://manager:8080/svc/; proxy_buffering off; }   # SSE
  location / { try_files $uri /index.html; }
}
