# OB-TRACE 수집 (FR-OB-TRACE-01): OTLP gRPC 4317 · HTTP 4318 → memory_limiter → batch → file(M0 검증 싱크) + debug.
# M1 2차: ClickHouse 저장(30일 TTL, PRD §14.5)·검색. file 싱크는 회귀 시험용으로 유지. tail sampling 은 후속.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 256 }
  batch: { timeout: 1s }
  # GR-PII-07 — 저장 전에 span·resource 속성의 한국형 PII 를 정화 (원문이 trace 저장소로 흘러가지 않게)
  transform/pii:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_all_patterns(attributes, "value", "\\d{6}-?[1-8]\\d{6}", "[KR_RRN]")
          - replace_all_patterns(attributes, "value", "01[016789]-?\\d{3,4}-?\\d{4}", "[PHONE_KR]")
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[EMAIL]")
          - replace_all_patterns(attributes, "value", "\\d{4}[ -]?\\d{4}[ -]?\\d{4}[ -]?\\d{4}", "[CARD]")
          - replace_pattern(name, "\\d{6}-?[1-8]\\d{6}", "[KR_RRN]")
exporters:
  file:
    path: /data/traces.jsonl
    rotation: { max_megabytes: 50, max_backups: 2 }
  debug: { verbosity: basic }
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    create_schema: true
    ttl: 720h
    timeout: 10s
    retry_on_failure: { enabled: true, initial_interval: 2s, max_elapsed_time: 120s }
extensions:
  health_check: { endpoint: 0.0.0.0:13133 }
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/pii, batch]
      exporters: [file, clickhouse, debug]
