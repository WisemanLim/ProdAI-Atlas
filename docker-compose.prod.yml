  sandbox:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  nats:
    restart: unless-stopped

  db:
    image: ${DB_IMAGE:-pgvector/pgvector:pg17}   # pgvector 포함 PostgreSQL 17 (X-KB 벡터 검색)
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER 필요 / required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필요 / required}
      POSTGRES_DB: ${DB_NAME:-app}
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  # IAM 저장소 — 공유 PostgreSQL 에 keycloak·openfga 데이터베이스를 만든다 (1회성)
  iam-db-init:
    image: ${DB_IMAGE:-pgvector/pgvector:pg17}   # pgvector 포함 PostgreSQL 17 (X-KB 벡터 검색)
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    entrypoint: ["sh", "-c", "for d in keycloak openfga; do psql -h db -U \"$$DB_USER\" -d \"$$DB_NAME\" -tAc \"SELECT 1 FROM pg_database WHERE datname='$$d'\" | grep -q 1 || psql -h db -U \"$$DB_USER\" -d \"$$DB_NAME\" -c \"CREATE DATABASE $$d\"; done"]
    env_file: [".env.prod"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  keycloak:
    command: ["start", "--import-realm", "--hostname-strict=false"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      iam-db-init: { condition: service_completed_successfully }
    restart: unless-stopped

  openfga-migrate:
    image: openfga/openfga:v1.10.2
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/openfga?sslmode=disable
    depends_on:
      iam-db-init: { condition: service_completed_successfully }
    restart: "no"

  openfga:
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/openfga?sslmode=disable
    depends_on:
      openfga-migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # 비밀 저장소 OpenBao (FR-PLT-SEC-01) — file 스토리지, 초기화·봉인 해제는 openbao-init
  openbao:
    image: openbao/openbao:2.4
    command: ["server"]
    environment:
      BAO_LOCAL_CONFIG: '{"storage":{"file":{"path":"/openbao/file"}},"listener":[{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}}],"disable_mlock":true,"ui":false,"api_addr":"http://openbao:8200"}'
    volumes: ["baodata:/openbao/file"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  openbao-init:
    image: openbao/openbao:2.4
    entrypoint: ["sh", "/init/init.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
    volumes: ["./deploy/openbao:/init:ro", "baokeys:/keys", "baotokens:/tokens"]
    depends_on:
      openbao: { condition: service_healthy }
    restart: "no"

volumes:
  baodata:
  baokeys:
  baotokens:
  dbdata:
