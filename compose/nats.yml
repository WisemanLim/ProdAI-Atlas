# extras/nats — 이벤트 버스 (PRD §14.4: NATS JetStream 기본 / Kafka 선택). make 가 compose/*.yml 을 자동 포함한다.
services:
  nats:
    image: ${NATS_IMAGE:-nats:2.11-alpine}
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${NATS_PORT:-4222}:4222"
      - "${BIND_HOST:-127.0.0.1}:${NATS_MONITOR_PORT:-8222}:8222"
    volumes: ["natsdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  natsdata:
