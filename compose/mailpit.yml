# 알림 이메일 수신함 (FR-X-NTF-02) — 개발·리허설용 SMTP 캡처. 실제 운영은 ATLAS_SMTP_ADDR 를 사내 릴레이로 바꾼다.
services:
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"   # 웹 UI · API
      - "${BIND_HOST:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
