# extras/clickhouse — trace·로그 저장소 (PRD §14.5 · FR-OB-TRACE-07). make 가 compose/*.yml 을 자동 포함한다.
services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8}
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-atlas}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD 필요}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes: ["chdata:/var/lib/clickhouse"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  chdata:
